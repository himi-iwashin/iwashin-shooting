<!doctype html>
<html lang="ja">
<head>

<title>イワシんの海まもり大作戦</title>
<style>
:root{color-scheme:dark;--ink:#f5fbff;--mint:#74f0dc;--gold:#ffe08a;--pink:#ff8fa7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041b31;color:var(--ink);font-family:'M PLUS Rounded 1c',system-ui,sans-serif;touch-action:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 10%,#15577a 0,#092f4e 40%,#041b31 100%)}
#game{position:relative;width:min(100vw,56.25vh,480px);height:min(100dvh,177.78vw,854px);overflow:hidden;border:1px solid #7ddbd344;border-radius:24px;background:linear-gradient(#12547a 0%,#0b4267 36%,#063553 70%,#041e3a 100%);box-shadow:0 20px 90px #0009;isolation:isolate}
@media(max-width:520px){#game{width:100vw;height:100dvh;border:0;border-radius:0}}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.hud{position:absolute;z-index:3;inset:0 0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 8px #001a2b}
.brand{font-size:12px;font-weight:900;letter-spacing:.08em;color:#bffdf0}.stats{display:flex;gap:8px}.pill{background:#001d34a8;border:1px solid #b5f8ff45;border-radius:99px;padding:7px 11px;font-size:13px;font-weight:800;backdrop-filter:blur(8px)}.hearts{color:#ff9bb0;letter-spacing:2px}
.stage-label{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 48px);left:0;width:100%;text-align:center;font-size:12px;font-weight:900;letter-spacing:.06em;color:#e4fbff;text-shadow:0 2px 8px #001a2b;pointer-events:none}.bossbar{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 72px);left:14%;width:72%;height:8px;background:#00172b99;border:1px solid #ffffff44;border-radius:99px;overflow:hidden;display:none}.bossbar.show{display:block}.bossfill{width:100%;height:100%;background:linear-gradient(90deg,#ff7893,#ffd179);transition:width .15s}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(#05233c5c,#03192bd9);text-align:center}.overlay.hidden{display:none}.panel{width:min(100%,380px);max-height:calc(100dvh - 32px);overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:24px 20px 20px;border-radius:28px;background:linear-gradient(160deg,#145273ed,#082d4bf2);border:1px solid #b7f8ff55;box-shadow:0 18px 55px #001322aa}.mascot{font-size:68px;line-height:1.2;filter:drop-shadow(0 5px 0 #001b31)}h1{font-size:26px;line-height:1.35;margin:10px 0 8px;font-weight:900;letter-spacing:.02em}.lead{font-size:14px;line-height:1.8;color:#d7f4fa;margin:0 0 17px}.how{white-space:pre-line;font-size:12px;line-height:1.75;color:#bde4ef;background:#031f35a8;border-radius:15px;padding:10px 12px;margin:0 0 18px}.btn{border:0;border-radius:99px;padding:13px 28px;background:linear-gradient(100deg,#ffdc75,#ffb753);color:#18314a;font:900 17px inherit;font-family:inherit;font-size:17px;font-weight:900;box-shadow:0 5px 0 #bc763f;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #bc763f}.small{font-size:11px;color:#a9d5e3;margin-top:12px}.panel.clear-panel{border-color:#ffe28b;box-shadow:0 0 0 3px #ffe28b22,0 18px 65px #001322cc}.clear-stamp{display:inline-block;margin:0 auto 5px;padding:5px 17px;border-radius:99px;background:linear-gradient(90deg,#ffdf75,#fff3af);color:#553700;font-size:13px;font-weight:1000;letter-spacing:.18em;box-shadow:0 3px 0 #bb853a;animation:stamp-in .5s cubic-bezier(.2,1.5,.5,1)}@keyframes stamp-in{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}.result-grid{display:grid;gap:6px;margin:12px 0;padding:9px;background:#031f35a8;border-radius:14px;text-align:left}.result-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid #b5f8ff28;font-size:11px;color:#ddf7f8}.result-row:last-child{border:0}.result-row b{color:#ffe08a}.result-total{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:900;color:#fff}.result-total b{color:#ffe08a}.record-line{margin-top:8px;color:#bde4ef;font-size:11px}.overlay.cleared{background:linear-gradient(#05233c88,#031323ee)}.overlay.cleared .panel{animation:clear-glow 2.5s ease-in-out infinite alternate}@keyframes clear-glow{from{box-shadow:0 0 18px #ffe08b44,0 18px 55px #001322aa}to{box-shadow:0 0 38px #ffe08b99,0 18px 55px #001322aa}}
.mascot img{width:76px;height:76px;object-fit:cover;border-radius:50%;border:3px solid #d7ffff;vertical-align:middle}
.mascot.outcome{position:relative;display:inline-block;margin:2px auto 8px}.mascot.outcome img{width:138px;height:138px;object-fit:contain;border:0;border-radius:16px;background:transparent;box-shadow:none;filter:drop-shadow(0 7px 10px #001a2b88)}.mascot.outcome.happy:after{content:'✨';position:absolute;right:-12px;top:-7px;font-size:29px}.mascot.outcome.sad:after{content:'💧';position:absolute;right:-10px;top:3px;font-size:25px}
.toast{position:absolute;z-index:4;top:20%;left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;padding:9px 16px;border-radius:99px;background:#e4fff2;color:#095342;font-weight:900;white-space:nowrap;transition:.25s}.toast.on{opacity:1;transform:translate(-50%,0)}
.sound{position:absolute;z-index:4;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:42px;height:42px;border-radius:50%;border:1px solid #b8efff55;background:#062b47a8;color:white;font-size:18px}
@media(max-width:520px){.overlay{padding:10px}.overlay .panel{max-height:72dvh;max-height:min(72dvh,calc(100dvh - 150px));padding:16px 14px 14px;border-radius:22px}.overlay .mascot img{width:62px;height:62px}.overlay h1{font-size:22px;margin:6px 0}.overlay .lead{font-size:13px;margin-bottom:12px}.overlay .how{padding:8px 10px;margin-bottom:12px}.overlay .btn{padding:11px 20px}}
.special{position:absolute;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);border:1px solid #fff8;border-radius:99px;padding:10px 18px;background:linear-gradient(100deg,#8ef6e0,#71cfff);color:#07334d;font:900 14px inherit;font-family:inherit;box-shadow:0 4px 0 #266a86;cursor:pointer}.special:disabled{filter:grayscale(.7);opacity:.72}.route-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 4px}.route-card{border:1px solid #a8eaff55;border-radius:13px;padding:9px;background:#062f4da8;color:#e8faff;font:700 11px inherit;font-family:inherit;cursor:pointer}.route-card.selected{outline:2px solid #ffe08a;background:#145878}
</style>
</head>
<body>
<main id="game" aria-label="イワシんの海まもり大作戦">
  <canvas id="stage"></canvas>
  <header class="hud"><div class="brand">🐟 HIMI OCEAN GUARDIANS</div><div class="stats"><div class="pill">救出 <span id="rescued">0</span> / ごみ <span id="score">0</span></div><div class="pill" id="shieldCount">泡 0</div><div class="pill hearts" id="hearts">♥♥♥</div></div></header>
  <div class="stage-label" id="stageLabel">川の河口</div><div class="bossbar" id="bossbar"><div class="bossfill" id="bossfill"></div></div>
  <div class="toast" id="toast">魚の仲間を救出！</div>
  <section class="overlay" id="overlay"><div class="panel"><div class="mascot"><img src="iwashin-character.jpg" alt="イワシん"></div><h1>イワシんの<br>海まもり大作戦</h1><p class="lead">森の水を運ぶ川から、定置網を越えて深海へ。<br>3つの海を進み、魚の仲間を守ろう！</p><p class="how">タッチした場所へ移動して泡を発射<br>ごみの攻撃をよけて、魚を助けよう<br>ステージごとのボスを倒せば次の海へ！</p><button class="btn" id="start">コース・ステージ選択へ</button><div class="small">指を離しても自動で泡を発射するよ</div></div></section>
  <button class="sound" id="sound" aria-label="効果音の切り替え">♫</button>
  <button class="special" id="special" disabled>必殺技 0%</button>
</main>
<script>
(()=>{
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),game=document.querySelector('#game');
const iwashinArt=new Image();iwashinArt.src='iwashin-character.jpg';const seafoodSheet=new Image();seafoodSheet.src='seafood-icons.png';const iconArts=[seafoodSheet];
const scoreEl=document.querySelector('#score'),rescuedEl=document.querySelector('#rescued'),stageLabel=document.querySelector('#stageLabel'),heartsEl=document.querySelector('#hearts'),shieldEl=document.querySelector('#shieldCount'),overlay=document.querySelector('#overlay'),bossbar=document.querySelector('#bossbar'),bossfill=document.querySelector('#bossfill'),toast=document.querySelector('#toast'),soundBtn=document.querySelector('#sound'),specialBtn=document.querySelector('#special');let startBtn=document.querySelector('#start');
let W=0,H=0,dpr=1,mode='title',last=0,elapsed=0,score=0,rescued=0,debrisCleaned=0,stageRescued=0,stageDebris=0,stageStartScore=0,stageResults=[],lives=3,stageIndex=0,player,shots=[],enemyShots=[],foes=[],sparks=[],bubbles=[],boss=null,spawnClock=0,fireClock=0,toastClock=0,muted=false,audio=null,pointerDown=false,targetX=null,targetY=null,shake=0;
let course='normal',selectedStage=0,runQueue=[0,1,2],queuePos=0,weaponLevel=0,shield=0,weaponRoute='spread',companions=[],podClock=0,specialCharge=0,stageHazard=0;
const ROUTES=[{id:'spread',name:'魚群ウェーブ',desc:'広がる泡で敵をまとめて攻撃'},{id:'focus',name:'潮流レーザー',desc:'前方集中・貫通でボスに強い'},{id:'homing',name:'追尾バブル',desc:'敵を追いかけて当たる泡'}];
const COURSE=[{id:'normal',name:'通常コース',mult:1,unlock:0},{id:'hell',name:'フィッシュヘル',mult:1.35,unlock:1},{id:'heaven',name:'フィッシュヘブン',mult:1.75,unlock:2},{id:'god',name:'イワシンゴッド',mult:2.25,unlock:3}];
const readProgress=()=>{try{return JSON.parse(localStorage.getItem('iwashinShootProgress')||'{"cleared":[],"unlocks":["normal"]}')}catch{return{cleared:[],unlocks:['normal']}}};
function saveClear(){const p=readProgress();p.cleared=[...new Set([...(p.cleared||[]),stageIndex])];if((p.cleared||[]).length>=3&&!p.unlocks.includes('hell'))p.unlocks.push('hell');if(p.unlocks.includes('hell')&&p.courses?.hell&&!p.unlocks.includes('heaven'))p.unlocks.push('heaven');if(p.unlocks.includes('heaven')&&p.courses?.heaven&&!p.unlocks.includes('god'))p.unlocks.push('god');p.courses??={};p.courses[course]=true;if(course==='hell'&&!p.unlocks.includes('heaven'))p.unlocks.push('heaven');if(course==='heaven'&&!p.unlocks.includes('god'))p.unlocks.push('god');localStorage.setItem('iwashinShootProgress',JSON.stringify(p))}
function difficulty(){return COURSE.find(c=>c.id===course)?.mult||1}
const STAGES=[
 {name:'川の河口',story:'森から流れてきた枝や袋が、河口にたまっている。魚たちを助けて流れを取り戻そう。',boss:'流れごみの大だんご',kinds:['bag','bottle','branch'],colors:['#51c7b4','#087a8c','#063c60'],bossType:'river'},
 {name:'定置網の中',story:'氷見の定置網に、古い網やロープがからみついた。網にかかった仲間を助けて、からまり大網をほどこう。',boss:'からまり大網',kinds:['net','buoy','rope'],colors:['#247b9c','#0b456f','#062b50'],bossType:'net'},
 {name:'氷見の深海',story:'光の届かない深海で、ごみをまとった大きな影が動いている。仲間と力を合わせ、海を元の姿に戻そう。',boss:'深海ごみクジラ',kinds:['can','ghost','bottle'],colors:['#183c70','#101d4b','#050d2c'],bossType:'deep'}
];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ENEMY={
 bag:{speed:64,drift:22,sway:1.25,hp:1,fireEvery:2.35,bulletSpeed:118},
 bottle:{speed:91,drift:58,sway:2.4,hp:1,fireEvery:1.65,bulletSpeed:145},
 branch:{speed:72,drift:34,sway:1.1,hp:1,fireEvery:2.05,bulletSpeed:160},
 net:{speed:47,drift:17,sway:.85,hp:2,fireEvery:1.55,bulletSpeed:120},
 buoy:{speed:54,drift:13,sway:.65,hp:1,fireEvery:2.05,bulletSpeed:132},
 rope:{speed:79,drift:46,sway:1.8,hp:1,fireEvery:1.85,bulletSpeed:138},
 can:{speed:67,drift:24,sway:1.3,hp:1,fireEvery:1.75,bulletSpeed:155},
 ghost:{speed:73,drift:48,sway:3.6,hp:2,fireEvery:1.25,bulletSpeed:130}
};
function resize(){const r=game.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.x=clamp(player.x,player.r,W-player.r);player.y=clamp(player.y,H*.43,H-player.r-8)}}
new ResizeObserver(resize).observe(game);resize();
function enableMediaAudioSession(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch{}}
function sound(freq=520,dur=.07,type='sine',vol=.035){if(muted)return;enableMediaAudioSession();try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function playFanfare(){if(muted)return;enableMediaAudioSession();try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime+.06,notes=[[523,.2],[659,.2],[784,.2],[1047,.52],[784,.17],[988,.17],[1047,.82]];let at=now;for(const [hz,dur] of notes){const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(hz,at);g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(.075,at+.025);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g);g.connect(audio.destination);o.start(at);o.stop(at+dur+.02);at+=dur+.045}const chord=audio.createOscillator(),cg=audio.createGain();chord.type='sine';chord.frequency.setValueAtTime(262,now+.58);cg.gain.setValueAtTime(.0001,now+.58);cg.gain.linearRampToValueAtTime(.045,now+.72);cg.gain.exponentialRampToValueAtTime(.0001,now+2.7);chord.connect(cg);cg.connect(audio.destination);chord.start(now+.58);chord.stop(now+2.75)}catch{}}
soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=muted?'♪':'♫'};
function begin(){score=0;rescued=0;debrisCleaned=0;stageRescued=0;stageDebris=0;stageResults=[];lives=3;queuePos=0;runQueue=course==='normal'?(selectedStage===0&&readProgress().cleared?.length<3?[0,1,2]:[selectedStage]):[0,1,2];stageIndex=runQueue[0];weaponLevel=0;shield=0;companions=[];specialCharge=0;player={x:W/2,y:H*.78,r:22,inv:0,power:0};shots=[];enemyShots=[];foes=[];sparks=[];boss=null;overlay.classList.remove('cleared');overlay.querySelector('.panel').classList.remove('clear-panel');updateHUD();showStageIntro()}
function showStageIntro(){const st=STAGES[stageIndex];mode='break';overlay.classList.remove('hidden');overlay.querySelector('.mascot').innerHTML='<img src="iwashin-character.jpg" alt="イワシん">';overlay.querySelector('h1').innerHTML=`${stageIndex+1}｜${st.name}`;overlay.querySelector('.lead').textContent=st.story;const panel=overlay.querySelector('.panel'),how=panel.querySelector('.how');how.innerHTML=`今回のボス：${st.boss}<br>ステージごとに武器ルートを選べます。<div class="route-list">${ROUTES.map(r=>`<button class="route-card ${weaponRoute===r.id?'selected':''}" data-route="${r.id}"><b>${r.name}</b><br>${r.desc}</button>`).join('')}</div>${course!=='normal'?'🔴 ハード予告：敵やボスの攻撃前に赤く知らせます。':'攻撃の予告を見て、タイミングよく避けよう。'}`;how.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{weaponRoute=b.dataset.route;how.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('selected',x===b))});startBtn.textContent=queuePos===0?'この武器で出発！':'この武器で次の海へ';startBtn.onclick=launchStage;stageLabel.textContent=`${stageIndex+1}/3 ${st.name}・${COURSE.find(c=>c.id===course)?.name||'通常'}`}
function launchStage(){mode='play';elapsed=0;stageRescued=0;stageDebris=0;stageStartScore=score;weaponLevel=0;companions=[];podClock=.15;specialCharge=0;stageHazard=0;shots=[];enemyShots=[];foes=[];boss=null;spawnClock=.4;fireClock=0;overlay.classList.add('hidden');bossbar.classList.remove('show');stageLabel.textContent=`${stageIndex+1}/3 ${STAGES[stageIndex].name}・${ROUTES.find(r=>r.id===weaponRoute).name}`;updateHUD();last=performance.now();requestAnimationFrame(loop);notice(STAGES[stageIndex].name+'を進もう！');sound(700,.12)}
startBtn.onclick=showMenu;
function showMenu(){mode='title';overlay.classList.remove('hidden','cleared');overlay.querySelector('.panel').classList.remove('clear-panel');const p=readProgress(),unlocked=p.unlocks||['normal'],cleared=p.cleared||[];const panel=overlay.querySelector('.panel');panel.innerHTML=`<div class="mascot"><img src="iwashin-character.jpg" alt="イワシん"></div><h1>海まもりコース</h1><p class="lead">クリアした海域は何度でも遊べるよ！</p><div class="how"><b>コースを選ぶ</b><div id="courseList"></div><br><b>ステージを選ぶ</b><div id="stageList"></div><p>ヘル：3海域クリア<br>ヘブン：ヘルをクリア<br>ゴッド：ヘブンをクリア</p></div><button class="btn" id="menuStart">選んだコースへ</button>`;const cl=panel.querySelector('#courseList'),sl=panel.querySelector('#stageList');COURSE.forEach(c=>{const b=document.createElement('button');b.className='btn';b.style.cssText='font-size:12px;padding:7px 10px;margin:3px';b.textContent=unlocked.includes(c.id)?c.name+' ✓':c.name+' 🔒';b.disabled=!unlocked.includes(c.id);b.onclick=()=>{course=c.id;showMenu()};if(course===c.id)b.style.outline='2px solid #fff';cl.appendChild(b)});STAGES.forEach((st,i)=>{const ok=course!=='normal'||i===0||cleared.includes(i)||(i>0&&cleared.includes(i-1));const b=document.createElement('button');b.className='btn';b.style.cssText='font-size:12px;padding:7px 10px;margin:3px';b.textContent=cleared.includes(i)?`${i+1}. ${st.name} ✓`:ok?`${i+1}. ${st.name} 解放`:`${i+1}. ${st.name} 🔒`;b.disabled=course!=='normal'?!unlocked.includes(course):!ok;b.onclick=()=>{selectedStage=i;showMenu()};if(selectedStage===i)b.style.outline='2px solid #fff';sl.appendChild(b)});startBtn=panel.querySelector('#menuStart');startBtn.onclick=begin}
function rescueCompanion(f){specialCharge=Math.min(100,specialCharge+20);if(f.rescueType==='shield'){const before=shield;shield=Math.min(4,shield+1);notice(before===shield?'シールド仲間！ バリアは最大まで強化中':'シールド仲間を救出！ バリア '+shield+'枚');burst(player.x,player.y,'#8cf6ff',12);sound(560,.2,'sine',.045)}else{weaponLevel=Math.min(8,weaponLevel+1);companions.push({x:player.x,y:player.y,phase:rand(0,6),shot:rand(.1,.5)});const names=['泡ショット','二連ショット','三方向ショット','五方向ウェーブ','六連ホーミング','七連・貫通ショット','強化ホーミング','海まもり最終形'];notice(`子機が仲間入り！ ${names[Math.min(weaponLevel-1,names.length-1)]} Lv.${weaponLevel}`);player.power=Math.max(player.power,2.5);burst(player.x,player.y,'#ffe18e',10);sound(980,.2,'sine',.045)}updateHUD()}
function updateHUD(){scoreEl.textContent=score.toLocaleString('ja-JP');rescuedEl.textContent=rescued;heartsEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);shieldEl.textContent='泡 '+shield;specialBtn.textContent=`必殺技 ${Math.floor(specialCharge)}%`;specialBtn.disabled=specialCharge<100||mode!=='play'}
function activateSpecial(){if(mode!=='play'||specialCharge<100)return;specialCharge=0;enemyShots=[];foes=foes.filter(f=>f.kind==='fish');if(boss){boss.hp-=Math.max(24,boss.max*.12);boss.hit=.5;boss.phase=Math.min(2,Math.floor((1-boss.hp/boss.max)*3));if(boss.hp<=0)bossDefeated()}burst(player.x,player.y,'#a8fff0',32);notice('必殺！仲間たちの大波攻撃！');sound(220,.45,'sawtooth',.07);updateHUD()}
specialBtn.onclick=activateSpecial;window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();activateSpecial()}});
function notice(t){toast.textContent=t;toast.classList.add('on');toastClock=1.5}
function setTarget(e,pressed=true){const r=canvas.getBoundingClientRect();targetX=clamp(e.clientX-r.left,player?.r||22,W-(player?.r||22));targetY=clamp(e.clientY-r.top,H*.43,H-(player?.r||22)-8);pointerDown=pressed}

if(stageIndex===0&&mode==='play'){ctx.save();ctx.strokeStyle='rgba(157,255,229,.24)';ctx.lineWidth=2;for(let i=0;i<5;i++){const y=(elapsed*90+i*180)%(H+80)-40;ctx.beginPath();ctx.moveTo(0,y);ctx.quadraticCurveTo(W*.5,y+Math.sin(elapsed+i)*18,W,y+Math.cos(elapsed+i)*18);ctx.stroke()}ctx.restore()}else if(stageIndex===1&&mode==='play'){ctx.save();ctx.strokeStyle='rgba(195,241,255,.16)';ctx.lineWidth=3;const shift=Math.sin(elapsed*.45)*W*.16;for(let x=-W;x<W*2;x+=W*.62){ctx.beginPath();ctx.moveTo(x+shift,0);ctx.lineTo(x-shift,H);ctx.stroke()}ctx.restore()}else if(stageIndex===2&&mode==='play'&&Math.sin(elapsed*.55)>.78){ctx.fillStyle='rgba(0,3,30,.28)';ctx.fillRect(0,0,W,H)}
if(boss){ctx.save();ctx.translate(boss.x,boss.y);if(boss.hit>0)ctx.globalAlpha=.72+Math.sin(elapsed*40)*.25;if(boss.phase===1)ctx.filter='hue-rotate(28deg) saturate(1.25)';if(boss.phase===2)ctx.filter='hue-rotate(85deg) saturate(1.5)';if(boss.type==='deep'){ctx.fillStyle='#6379d1';ctx.strokeStyle='#c9d8ff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,53,33,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(66,-16);ctx.lineTo(62,12);ctx.closePath();ctx.fill();ctx.fillStyle='#ffb76a';ctx.beginPath();ctx.arc(25,-9,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#94e9ff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-20,25);ctx.quadraticCurveTo(-45,48,-12,43);ctx.stroke()}else if(boss.type==='net'){ctx.fillStyle='#d66e8d';ctx.strokeStyle='#ffe2b3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,48,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#fff9';ctx.lineWidth=2;for(let d=-36;d<=36;d+=12){ctx.beginPath();ctx.moveTo(d,-40);ctx.lineTo(d,40);ctx.moveTo(-40,d);ctx.lineTo(40,d);ctx.stroke()}}else{ctx.fillStyle='#987b65';ctx.strokeStyle='#d9c5a3';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-48,-24);ctx.quadraticCurveTo(-15,-52,12,-28);ctx.quadraticCurveTo(56,-17,36,25);ctx.quadraticCurveTo(5,52,-38,27);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#8ee9ff';ctx.beginPath();ctx.arc(13,-8,7,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(`${boss.name}・第${boss.phase+1}形態`,boss.x,boss.y-58);if(boss.warn>0){ctx.save();ctx.strokeStyle=`rgba(255,75,92,${.45+Math.sin(elapsed*30)*.35})`;ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(boss.x,boss.y+28);ctx.lineTo(player?.x||W/2,H*.82);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff7c83';ctx.font='bold 12px system-ui';ctx.fillText('攻撃予告！',boss.x,boss.y+57);ctx.restore()}}
if(player&&mode==='play'){ctx.save();if(player.inv>0&&Math.floor(elapsed*14)%2===0)ctx.globalAlpha=.4;if(shield>0){ctx.strokeStyle='rgba(124,244,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,player.r+8+Math.sin(elapsed*5)*2,0,Math.PI*2);ctx.stroke()}drawIwashin(player.x,player.y,player.r);ctx.fillStyle='#eaf9f4';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('イワシん',player.x,player.y+39);ctx.restore()}
ctx.restore()}
function loop(now){if(mode!=='play')return;const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();if(mode==='play')requestAnimationFrame(loop)}
