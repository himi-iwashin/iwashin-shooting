<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#062b47">
<meta name="description" content="イワシんと氷見の海を守る、スマホで遊べるシューティングゲーム。">
<title>イワシんの海まもり大作戦</title>
<style>
:root{color-scheme:dark;--ink:#f5fbff;--mint:#74f0dc;--gold:#ffe08a;--pink:#ff8fa7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041b31;color:var(--ink);font-family:'M PLUS Rounded 1c',system-ui,sans-serif;touch-action:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 10%,#15577a 0,#092f4e 40%,#041b31 100%)}
#game{position:relative;width:min(100vw,56.25vh,480px);height:min(100dvh,177.78vw,854px);overflow:hidden;border:1px solid #7ddbd344;border-radius:24px;background:linear-gradient(#12547a 0%,#0b4267 36%,#063553 70%,#041e3a 100%);box-shadow:0 20px 90px #0009;isolation:isolate}
@media(max-width:520px){#game{width:100vw;height:100dvh;border:0;border-radius:0}}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.hud{position:absolute;z-index:3;inset:0 0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 8px #001a2b}
.brand{font-size:12px;font-weight:900;letter-spacing:.08em;color:#bffdf0}.stats{display:flex;gap:8px}.pill{background:#001d34a8;border:1px solid #b5f8ff45;border-radius:99px;padding:7px 11px;font-size:13px;font-weight:800;backdrop-filter:blur(8px)}.hearts{color:#ff9bb0;letter-spacing:2px}
.stage-label{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 48px);left:0;width:100%;text-align:center;font-size:12px;font-weight:900;letter-spacing:.06em;color:#e4fbff;text-shadow:0 2px 8px #001a2b;pointer-events:none}.bossbar{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 58px);left:14%;width:72%;height:8px;background:#00172b99;border:1px solid #ffffff44;border-radius:99px;overflow:hidden;display:none}.bossbar.show{display:block}.bossfill{width:100%;height:100%;background:linear-gradient(90deg,#ff7893,#ffd179);transition:width .15s}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:linear-gradient(#05233c5c,#03192bd9);text-align:center}.overlay.hidden{display:none}.panel{width:min(100%,360px);padding:26px 22px 22px;border-radius:28px;background:linear-gradient(160deg,#145273ed,#082d4bf2);border:1px solid #b7f8ff55;box-shadow:0 18px 55px #001322aa}.mascot{font-size:68px;line-height:1.2;filter:drop-shadow(0 5px 0 #001b31)}h1{font-size:26px;line-height:1.35;margin:10px 0 8px;font-weight:900;letter-spacing:.02em}.lead{font-size:14px;line-height:1.8;color:#d7f4fa;margin:0 0 17px}.how{white-space:pre-line;font-size:12px;line-height:1.75;color:#bde4ef;background:#031f35a8;border-radius:15px;padding:10px 12px;margin:0 0 18px}.btn{border:0;border-radius:99px;padding:13px 28px;background:linear-gradient(100deg,#ffdc75,#ffb753);color:#18314a;font:900 17px inherit;font-family:inherit;font-size:17px;font-weight:900;box-shadow:0 5px 0 #bc763f;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #bc763f}.small{font-size:11px;color:#a9d5e3;margin-top:12px}
.mascot img{width:76px;height:76px;object-fit:cover;border-radius:50%;border:3px solid #d7ffff;vertical-align:middle}
.toast{position:absolute;z-index:4;top:20%;left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;padding:9px 16px;border-radius:99px;background:#e4fff2;color:#095342;font-weight:900;white-space:nowrap;transition:.25s}.toast.on{opacity:1;transform:translate(-50%,0)}
.sound{position:absolute;z-index:4;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:42px;height:42px;border-radius:50%;border:1px solid #b8efff55;background:#062b47a8;color:white;font-size:18px}
</style>
</head>
<body>
<main id="game" aria-label="イワシんの海まもり大作戦">
  <canvas id="stage"></canvas>
  <header class="hud"><div class="brand">🐟 HIMI OCEAN GUARDIANS</div><div class="stats"><div class="pill">救出 <span id="rescued">0</span> / ごみ <span id="score">0</span></div><div class="pill hearts" id="hearts">♥♥♥</div></div></header>
  <div class="stage-label" id="stageLabel">川の河口</div><div class="bossbar" id="bossbar"><div class="bossfill" id="bossfill"></div></div>
  <div class="toast" id="toast">魚の仲間を救出！</div>
  <section class="overlay" id="overlay"><div class="panel"><div class="mascot"><img src="iwashin-character.jpg" alt="イワシん"></div><h1>イワシんの<br>海まもり大作戦</h1><p class="lead">森の水を運ぶ川から、定置網を越えて深海へ。<br>3つの海を進み、魚の仲間を守ろう！</p><p class="how">タッチした場所へ移動して泡を発射<br>ごみの攻撃をよけて、魚を助けよう<br>ステージごとのボスを倒せば次の海へ！</p><button class="btn" id="start">海へ出発！</button><div class="small">指を離しても自動で泡を発射するよ</div></div></section>
  <button class="sound" id="sound" aria-label="効果音の切り替え">♫</button>
</main>
<script>
(()=>{
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),game=document.querySelector('#game');
const iwashinArt=new Image();iwashinArt.src='iwashin-character.jpg';const seafoodSheet=new Image();seafoodSheet.src='seafood-icons.png';const iconArts=[seafoodSheet];
const scoreEl=document.querySelector('#score'),rescuedEl=document.querySelector('#rescued'),stageLabel=document.querySelector('#stageLabel'),heartsEl=document.querySelector('#hearts'),overlay=document.querySelector('#overlay'),startBtn=document.querySelector('#start'),bossbar=document.querySelector('#bossbar'),bossfill=document.querySelector('#bossfill'),toast=document.querySelector('#toast'),soundBtn=document.querySelector('#sound');
let W=0,H=0,dpr=1,mode='title',last=0,elapsed=0,score=0,rescued=0,lives=3,stageIndex=0,player,shots=[],enemyShots=[],foes=[],sparks=[],bubbles=[],boss=null,spawnClock=0,fireClock=0,toastClock=0,muted=false,audio=null,pointerDown=false,targetX=null,targetY=null,shake=0;
const STAGES=[
 {name:'川の河口',story:'森から流れてきた枝や袋が、河口にたまっている。魚たちを助けて流れを取り戻そう。',boss:'流れごみの大だんご',kinds:['bag','bottle','branch'],colors:['#51c7b4','#087a8c','#063c60'],bossType:'river'},
 {name:'定置網の中',story:'氷見の定置網に、古い網やロープがからみついた。網にかかった仲間を助けて、からまり大網をほどこう。',boss:'からまり大網',kinds:['net','buoy','rope'],colors:['#247b9c','#0b456f','#062b50'],bossType:'net'},
 {name:'氷見の深海',story:'光の届かない深海で、ごみをまとった大きな影が動いている。仲間と力を合わせ、海を元の姿に戻そう。',boss:'深海ごみクジラ',kinds:['can','ghost','bottle'],colors:['#183c70','#101d4b','#050d2c'],bossType:'deep'}
];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=game.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.x=clamp(player.x,28,W-28);player.y=clamp(player.y,H*.45,H-65)}}
new ResizeObserver(resize).observe(game);resize();
function sound(freq=520,dur=.07,type='sine',vol=.035){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=muted?'♪':'♫'};
function begin(){score=0;rescued=0;lives=3;stageIndex=0;player={x:W/2,y:H*.78,r:22,inv:0,power:0};shots=[];enemyShots=[];foes=[];sparks=[];boss=null;updateHUD();showStageIntro()}
function showStageIntro(){const st=STAGES[stageIndex];mode='break';overlay.classList.remove('hidden');overlay.querySelector('.mascot').innerHTML='<img src="iwashin-character.jpg" alt="イワシん">';overlay.querySelector('h1').innerHTML=`${stageIndex+1}｜${st.name}`;overlay.querySelector('.lead').textContent=st.story;overlay.querySelector('.how').textContent=`今回のボス：${st.boss}\n敵の攻撃をよけながら、泡でごみを片づけよう。`;startBtn.textContent=stageIndex===0?'出発！':'次の海へ';stageLabel.textContent=`${stageIndex+1}/3 ${st.name}`}
function launchStage(){mode='play';elapsed=0;shots=[];enemyShots=[];foes=[];boss=null;spawnClock=.4;fireClock=0;overlay.classList.add('hidden');bossbar.classList.remove('show');stageLabel.textContent=`${stageIndex+1}/3 ${STAGES[stageIndex].name}`;updateHUD();last=performance.now();requestAnimationFrame(loop);notice(STAGES[stageIndex].name+'を進もう！');sound(700,.12)}
startBtn.onclick=()=>{if(mode==='break')launchStage();else begin()};
function updateHUD(){scoreEl.textContent=score.toLocaleString('ja-JP');rescuedEl.textContent=rescued;heartsEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
function notice(t){toast.textContent=t;toast.classList.add('on');toastClock=1.5}
function setTarget(e){const r=canvas.getBoundingClientRect();targetX=e.clientX-r.left;targetY=e.clientY-r.top;pointerDown=true}
canvas.addEventListener('pointerdown',e=>{setTarget(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(pointerDown)setTarget(e)});canvas.addEventListener('pointerup',()=>pointerDown=false);canvas.addEventListener('pointercancel',()=>pointerDown=false);
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&mode!=='play')begin();if(!player)return;const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')targetX=player.x-65;if(k==='arrowright'||k==='d')targetX=player.x+65;if(k==='arrowup'||k==='w')targetY=player.y-65;if(k==='arrowdown'||k==='s')targetY=player.y+65});
function shoot(){shots.push({x:player.x,y:player.y-23,vy:-H*1.05,r:6,power:player.power>0?2:1});sound(740,.035,'triangle',.012)}
function spawn(){const roll=Math.random();if(roll<.2&&elapsed>5){foes.push({kind:'fish',x:rand(30,W-30),y:-30,vx:rand(-25,25),vy:rand(45,70),r:17,hp:1,phase:rand(0,6)});return}const st=STAGES[stageIndex],kind=st.kinds[Math.floor(Math.random()*st.kinds.length)];foes.push({kind,x:rand(28,W-28),y:-40,vx:rand(-32,32),vy:rand(55,100)+(elapsed*.35),r:kind==='net'||kind==='ghost'?22:17,hp:kind==='net'||kind==='ghost'?2:1,phase:rand(0,7),fire:rand(.8,2.2)})}
function bossStart(){const st=STAGES[stageIndex],hp=stageIndex===0?18:stageIndex===1?23:28;boss={type:st.bossType,name:st.boss,x:W/2,y:112,hp,max:hp,t:0,hit:0,attack:1.1};bossbar.classList.add('show');notice(st.boss+'が出現！');sound(150,.5,'sawtooth',.07)}
function bossDefeated(){score+=1000;updateHUD();boss=null;bossbar.classList.remove('show');enemyShots=[];mode='break';if(stageIndex===STAGES.length-1){notice('氷見の海がもとの姿に！');setTimeout(()=>finish(true),900)}else{stageIndex++;setTimeout(showStageIntro,850)}sound(880,.2)}
function fireEnemy(x,y,speed=150,spread=0){const dx=player.x-x,dy=player.y-y,len=Math.hypot(dx,dy)||1;enemyShots.push({x,y,vx:dx/len*speed+spread,vy:dy/len*speed,r:7})}
function bossAttack(){if(!boss)return;const b=boss;if(b.type==='river'){for(let i=-1;i<=1;i++)enemyShots.push({x:b.x+i*24,y:b.y+24,vx:i*55,vy:170,r:7})}else if(b.type==='net'){for(let i=-2;i<=2;i++)enemyShots.push({x:b.x,y:b.y+18,vx:i*65,vy:150,r:9})}else{for(let i=-1;i<=1;i++)fireEnemy(b.x,b.y+24,175,i*55)}}
function burst(x,y,color,n=10){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(30,180);sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.8),max:.8,color,r:rand(2,5)})}}
function hitPlayer(){if(player.inv>0)return;lives--;player.inv=1.25;shake=9;burst(player.x,player.y,'#ff96ab',16);sound(130,.22,'sawtooth',.06);updateHUD();if(lives<=0)finish(false)}
function finish(win){mode=win?'win':'over';bossbar.classList.remove('show');overlay.classList.remove('hidden');const best=Math.max(score,Number(localStorage.getItem('iwashinShootBest')||0));localStorage.setItem('iwashinShootBest',best);overlay.querySelector('.mascot').innerHTML=win?'🌊🐟':'🐟💫';overlay.querySelector('h1').innerHTML=win?'氷見の海を<br>守りきった！':'もう一度、<br>海を守ろう！';overlay.querySelector('.lead').innerHTML=win?`3つの海を守り、魚を${rescued}匹救出！<br>スコア <b>${score.toLocaleString('ja-JP')}</b>`:`${STAGES[stageIndex].name}で力つきた…<br>救出 ${rescued}匹 / スコア <b>${score.toLocaleString('ja-JP')}</b><br>ハイスコア <b>${best.toLocaleString('ja-JP')}</b>`;overlay.querySelector('.how').textContent=win?'川の河口、定置網、深海を守りきった！':'泡でごみを片づけ、赤い攻撃をよけよう。';startBtn.textContent='最初からあそぶ';sound(win?880:100,.45,win?'sine':'triangle',.05)}
function update(dt){elapsed+=dt;fireClock-=dt;spawnClock-=dt;toastClock-=dt;if(toastClock<=0)toast.classList.remove('on');if(shake>0)shake=Math.max(0,shake-dt*22);if(player.inv>0)player.inv-=dt;if(player.power>0)player.power-=dt;
if(targetX!==null&&pointerDown){player.x+=(targetX-player.x)*Math.min(1,dt*11);player.y+=(clamp(targetY,H*.43,H-54)-player.y)*Math.min(1,dt*11)}
if(fireClock<=0){shoot();fireClock=player.power>0?.16:.28}
if(elapsed<20&&spawnClock<=0){spawn();spawnClock=Math.max(.48,rand(.8,1.25)-elapsed*.006)}if(elapsed>=20&&!boss)bossStart();
shots.forEach(s=>s.y+=s.vy*dt);shots=shots.filter(s=>s.y>-20);
foes.forEach(f=>{f.y+=f.vy*dt;f.x+=Math.sin(elapsed*1.6+f.phase)*f.vx*dt;if(f.kind==='fish')f.x+=Math.sin(elapsed*3+f.phase)*38*dt;else{f.fire-=dt;if(f.fire<=0&&f.y>20&&f.y<H*.55){fireEnemy(f.x,f.y,130);f.fire=rand(2.0,3.0)}}});
for(let i=foes.length-1;i>=0;i--){const f=foes[i];let gone=false;if(f.kind!=='fish')for(let j=shots.length-1;j>=0;j--){const s=shots[j];if(Math.hypot(s.x-f.x,s.y-f.y)<f.r+s.r){f.hp-=s.power;shots.splice(j,1);burst(s.x,s.y,'#ffe18e',4);if(f.hp<=0){gone=true;score+=f.kind==='net'||f.kind==='ghost'?120:80;sound(420,.06);updateHUD()}break}}
if(!gone&&Math.hypot(player.x-f.x,player.y-f.y)<player.r+f.r-5){if(f.kind==='fish'){score+=300;rescued++;player.power=Math.min(8,player.power+2);notice('魚の仲間を救出！ '+rescued+'匹');sound(900,.16);updateHUD()}else hitPlayer();gone=true}
if(f.y>H+40)gone=true;if(gone){if(f.kind!=='fish'&&f.hp<=0)burst(f.x,f.y,'#f6ca72',12);foes.splice(i,1)}}
enemyShots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt});enemyShots=enemyShots.filter(s=>s.y<H+30&&s.x>-30&&s.x<W+30);
for(let i=enemyShots.length-1;i>=0;i--){const s=enemyShots[i];if(Math.hypot(player.x-s.x,player.y-s.y)<player.r+s.r-4){enemyShots.splice(i,1);hitPlayer()}}
if(boss){boss.t+=dt;boss.attack-=dt;boss.x=W/2+Math.sin(boss.t*(boss.type==='net'?1.65:1.1))*W*.28;boss.y=98+Math.sin(boss.t*2)*14;boss.hit=Math.max(0,boss.hit-dt);if(boss.attack<=0){bossAttack();boss.attack=boss.type==='river'?1.45:boss.type==='net'?1.15:1.3}for(let j=shots.length-1;j>=0;j--){const s=shots[j];if(Math.hypot(s.x-boss.x,s.y-boss.y)<50+s.r){boss.hp-=s.power;boss.hit=.08;shots.splice(j,1);burst(s.x,s.y,'#ffe18e',3);if(boss.hp<=0){bossDefeated();break}}}if(boss){bossfill.style.width=`${Math.max(0,boss.hp/boss.max*100)}%`;if(Math.hypot(player.x-boss.x,player.y-boss.y)<50)hitPlayer()}}
sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt});sparks=sparks.filter(p=>p.life>0);
}
function drawIwashin(x,y,size){if(!iwashinArt.complete||!iwashinArt.naturalWidth){fish(x,y,size);return}ctx.save();ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(x-size,y-size,size*2,size*2);const side=Math.min(iwashinArt.naturalWidth,iwashinArt.naturalHeight);ctx.drawImage(iwashinArt,(iwashinArt.naturalWidth-side)/2,(iwashinArt.naturalHeight-side)/2,side,side,x-size,y-size,size*2,size*2);ctx.restore();ctx.strokeStyle='#e8fbff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.stroke()}
function drawSeaIcon(x,y,size,index){const im=iconArts[Math.abs(index)%iconArts.length];if(!im||!im.complete||!im.naturalWidth){drawIwashin(x,y,size);return}ctx.save();ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.clip();const sw=im.naturalWidth/3,sh=im.naturalHeight/2,n=Math.abs(index)%6,sx=(n%3)*sw,sy=Math.floor(n/3)*sh;ctx.drawImage(im,sx,sy,sw,sh,x-size,y-size,size*2,size*2);ctx.restore();ctx.strokeStyle='#d8ffffaa';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.stroke()}
function draw(){ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.clearRect(-12,-12,W+24,H+24);
const st=STAGES[stageIndex]||STAGES[0],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,st.colors[0]);g.addColorStop(.52,st.colors[1]);g.addColorStop(1,st.colors[2]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(stageIndex===1){ctx.strokeStyle='rgba(182,235,245,.12)';ctx.lineWidth=1;for(let x=20;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x-15,H);ctx.stroke()}for(let y=35;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+8);ctx.stroke()}}if(stageIndex===2){for(let i=0;i<8;i++){const x=(i*67+Math.sin(elapsed*.7+i)*18)%W,y=(i*113+elapsed*18)%(H+10);ctx.fillStyle=`rgba(150,245,255,${.15+Math.sin(elapsed*2+i)*.1})`;ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill()}}
// light shafts and sea-floor ripples
for(let i=0;i<5;i++){const x=(i*W/4+Math.sin(elapsed*.3+i)*22);ctx.fillStyle=`rgba(155,239,232,${.035+Math.sin(elapsed+i)*.012})`;ctx.beginPath();ctx.moveTo(x-28,0);ctx.lineTo(x+12,0);ctx.lineTo(x+100,H);ctx.lineTo(x+10,H);ctx.fill()}
for(let i=0;i<22;i++){let y=((i*61+elapsed*42)% (H+40))-20;let x=(i*97+Math.sin(i+elapsed*.45)*30)%W;ctx.strokeStyle='rgba(167,236,239,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,y,rand(3,8),rand(5,12),0,0,Math.PI*2);ctx.stroke()}
ctx.fillStyle='#a6eaf0';ctx.globalAlpha=.24;ctx.fillRect(0,H-24,W,24);ctx.globalAlpha=1;
shots.forEach(s=>{ctx.shadowBlur=15;ctx.shadowColor='#aaffef';ctx.fillStyle='#dffff2';ctx.beginPath();ctx.ellipse(s.x,s.y,5,10,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
foes.forEach(f=>{ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(elapsed*2+f.phase)*.18);if(f.kind==='fish'){drawSeaIcon(0,0,f.r,Math.floor(f.phase)%5);ctx.restore();return}ctx.shadowBlur=13;ctx.shadowColor=f.kind==='net'?'#ff7c8d':'#f5cb78';ctx.fillStyle=f.kind==='bag'?'#c5a9ed':f.kind==='net'?'#ff8193':'#ffd27b';if(f.kind==='bottle'||f.kind==='can'){ctx.beginPath();ctx.roundRect(-9,-15,18,30,6);ctx.fill();if(f.kind==='bottle'){ctx.fillRect(-4,-20,8,7)}else{ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-14,8,3,0,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#fff8';ctx.fillRect(-5,-10,3,17)}else if(f.kind==='net'||f.kind==='ghost'){ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff8';ctx.lineWidth=2;for(let d=-12;d<=12;d+=8){ctx.beginPath();ctx.moveTo(d,-17);ctx.lineTo(d,17);ctx.moveTo(-17,d);ctx.lineTo(17,d);ctx.stroke()}}else{if(f.kind==='branch'||f.kind==='rope'){ctx.lineWidth=7;ctx.strokeStyle=f.kind==='branch'?'#947153':'#d8b66e';ctx.beginPath();ctx.moveTo(-18,8);ctx.quadraticCurveTo(0,-12,18,6);ctx.moveTo(-4,0);ctx.lineTo(-14,-12);ctx.moveTo(4,-3);ctx.lineTo(14,-15);ctx.stroke()}else if(f.kind==='buoy'){ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,15);ctx.lineTo(0,24);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(-13,-16);ctx.quadraticCurveTo(16,-22,13,5);ctx.quadraticCurveTo(8,20,-12,13);ctx.closePath();ctx.fill();ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(4,1,3,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(({bag:'袋',bottle:'ボトル',branch:'流木',net:'網',buoy:'浮き',rope:'ロープ',can:'缶',ghost:'漁網'}[f.kind]||'ごみ'),0,f.r+11);ctx.restore()});
enemyShots.forEach(s=>{ctx.save();ctx.shadowBlur=12;ctx.shadowColor='#ff6a73';ctx.fillStyle='#ffb06e';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.restore()});
sparks.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
if(boss){ctx.save();ctx.translate(boss.x,boss.y);if(boss.hit>0)ctx.globalAlpha=.72+Math.sin(elapsed*40)*.25;if(boss.type==='deep'){ctx.fillStyle='#6379d1';ctx.strokeStyle='#c9d8ff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,53,33,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(66,-16);ctx.lineTo(62,12);ctx.closePath();ctx.fill();ctx.fillStyle='#ffb76a';ctx.beginPath();ctx.arc(25,-9,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#94e9ff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-20,25);ctx.quadraticCurveTo(-45,48,-12,43);ctx.stroke()}else if(boss.type==='net'){ctx.fillStyle='#d66e8d';ctx.strokeStyle='#ffe2b3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,48,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#fff9';ctx.lineWidth=2;for(let d=-36;d<=36;d+=12){ctx.beginPath();ctx.moveTo(d,-40);ctx.lineTo(d,40);ctx.moveTo(-40,d);ctx.lineTo(40,d);ctx.stroke()}}else{ctx.fillStyle='#987b65';ctx.strokeStyle='#d9c5a3';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-48,-24);ctx.quadraticCurveTo(-15,-52,12,-28);ctx.quadraticCurveTo(56,-17,36,25);ctx.quadraticCurveTo(5,52,-38,27);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#8ee9ff';ctx.beginPath();ctx.arc(13,-8,7,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(boss.name,boss.x,boss.y-58)}
if(player&&mode==='play'){ctx.save();if(player.inv>0&&Math.floor(elapsed*14)%2===0)ctx.globalAlpha=.4;drawIwashin(player.x,player.y,player.r+8);ctx.fillStyle='#eaf9f4';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('イワシん',player.x,player.y+39);ctx.restore()}
ctx.restore()}
function loop(now){if(mode!=='play')return;const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();if(mode==='play')requestAnimationFrame(loop)}
draw();
})();
</script>
